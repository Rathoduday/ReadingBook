<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8c2f1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>E-books</title>
<style>
:root{--bg:#ede6d6;--ink:#2b2418;--muted:#6b5f49;--link:#2a4d8f;--card:#fff;--line:#d6cbb2;--accent:#8c2f1b;--sheet:#1d1a14;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--ink:#efe7d4;--muted:#a89c82;--link:#8fb0ee;--card:#2a261d;--line:#3d372a;--accent:#e08a6f;--sheet:#0e0d0a}}
:root[data-theme="dark"]{--bg:#1b1812;--ink:#efe7d4;--muted:#a89c82;--link:#8fb0ee;--card:#2a261d;--line:#3d372a;--accent:#e08a6f;--sheet:#0e0d0a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.4}
header{padding:16px 14px 6px}
h1{font-size:1.1rem;margin:0 0 10px;font-weight:700}
h1 small{color:var(--muted);font-weight:400}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px;padding:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr);max-width:1100px;margin:auto}}
.book{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.cover{width:100%;max-width:170px;aspect-ratio:3/4;border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.cover b{font-size:1.05rem;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cover i{font-size:.7rem;opacity:.85;margin-top:6px}
.title{margin:8px 0 6px;font-size:.92rem;color:var(--link);overflow-wrap:anywhere}
.view{font:inherit;font-size:.85rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;min-height:36px}
.view:disabled{opacity:.4;border-color:var(--line);color:var(--muted);cursor:default}
.view:focus-visible,.search:focus-visible,.bar button:focus-visible,.bar a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.empty{padding:30px 14px;text-align:center;color:var(--muted)}
details{margin:6px 14px 24px;font-size:.85rem;color:var(--muted)}
details summary{cursor:pointer;padding:8px 0}
textarea{width:100%;height:150px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.row button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#msg{color:var(--accent)}
.viewer{position:fixed;inset:0;background:var(--sheet);display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer.open{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#f3ecd9;font-size:.9rem}
.bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar a{color:#f3ecd9;border:1px solid #6d6452;background:transparent;border-radius:8px;padding:7px 12px;font:inherit;text-decoration:none;cursor:pointer}
.frame{flex:1;width:100%;border:0;background:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top h1{margin:0}
.add{font:inherit;font-size:.9rem;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-height:40px}
.add:focus-visible,.del:focus-visible,.sheet button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.del{font:inherit;font-size:.75rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:4px;padding:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:15}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0 0 10px;font-size:1.1rem}
.sheet label{display:block;font-size:.85rem;margin:10px 0 4px;color:var(--muted)}
.sheet input[type=text],.sheet input[type=url]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
.sheet input[type=file]{width:100%;font-size:.85rem;color:var(--ink)}
.sheet .row button{flex:1;min-height:42px}
.sheet .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#preview{width:70px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);border-radius:3px;margin-top:8px;display:none}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--sheet);color:#f3ecd9;padding:12px 14px;border-radius:10px;font-size:.85rem;z-index:30;display:none}
.toast.show{display:block}
.pages{flex:1;overflow:auto;background:#3a362c;padding:8px;-webkit-overflow-scrolling:touch}
.pg{display:block;margin:8px auto;background:#fff;max-width:none}
.last{display:flex;align-items:center;gap:12px;margin:8px 14px 0;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.last[hidden]{display:none}
.lthumb{width:44px;aspect-ratio:3/4;border-radius:3px;background-size:cover;background-position:center;flex:none}
.linfo{flex:1;min-width:0}
.lk{font-size:.75rem;color:var(--muted)}
.lt{font-size:.95rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst{font:inherit;font-size:.8rem;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:10px;min-height:34px}
.inst[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>E-books <small id="count"></small></h1>
    <button id="addBtn" class="add" type="button">+ Add book</button>
  </div>
  <input id="q" class="search" type="search" placeholder="Search books" aria-label="Search books">
  <button id="installBtn" class="inst" type="button">Install app / add shortcut</button>
</header>

<section id="last" class="last" hidden></section>

<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden>No books match your search.</p>

<details>
  <summary>Edit book data (JSON)</summary>
  <textarea id="json" spellcheck="false" aria-label="Book data JSON"></textarea>
  <div class="row">
    <button id="apply">Apply data</button>
    <button id="reset">Reset</button>
    <span id="msg" role="status"></span>
  </div>
</details>

<div id="toast" class="toast" role="status"></div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Add book">
  <div class="sheet">
    <h2>Add a book</h2>
    <label for="fTitle">Title</label>
    <input id="fTitle" type="text" placeholder="e.g. 108 Prasang Mala" autocomplete="off">
    <label for="fPdfFile">PDF file (saved in this browser)</label>
    <input id="fPdfFile" type="file" accept="application/pdf">
    <label for="fCover">Cover image (optional)</label>
    <input id="fCover" type="file" accept="image/*">
    <img id="preview" alt="Cover preview">
    <p id="fErr" class="empty" style="padding:8px 0;color:var(--accent)" role="alert"></p>
    <div class="row">
      <button id="fCancel" type="button">Cancel</button>
      <button id="fSave" type="button" class="primary">Save book</button>
    </div>
  </div>
</div>

<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="PDF viewer">
  <div class="bar">
    <button id="close">Close</button>
    <span id="vt"></span>
    <button id="zo" type="button" aria-label="Zoom out">−</button>
    <button id="zi" type="button" aria-label="Zoom in">+</button>
    <a id="open" target="_blank" rel="noopener">Open PDF</a>
  </div>
  <div id="pages" class="pages"></div>
</div>

<script>
/* Dynamic data: edit here or paste new JSON in the page.
   cover = image data: URI (optional); pdf = link to the PDF file. */
var DEFAULT_BOOKS = [
  {id:1,title:"100 Years of BAPS",color:"#b3261e",pdf:""},
  {id:2,title:"101 Pearls of Inspiration",color:"#8e1c3a",pdf:""},
  {id:3,title:"101 Pearls of Wisdom",color:"#e0452d",pdf:""},
  {id:4,title:"101 Tales of Wisdom",color:"#7a5a3a",pdf:""},
  {id:5,title:"108 Prasang Mala",color:"#c99a1a",pdf:""},
  {id:6,title:"108 પ્રસંગમાળા",color:"#b88a2e",pdf:""},
  {id:7,title:"200 Satsang Questions & Answers",color:"#c7731c",pdf:""},
  {id:8,title:"200 Swamini Vato",color:"#d6a21c",pdf:""},
  {id:9,title:"200 સ્વામીની વાતો",color:"#bd6a2a",pdf:""},
  {id:10,title:"Aa Che Brahmi Sthiti",color:"#3d5f8f",pdf:""},
  {id:11,title:"આર્યપુત્રીઓ! સાવધાન!",color:"#d9822b",pdf:""},
  {id:12,title:"आर्यपुत्रियों! सावधान!",color:"#d1a21a",pdf:""}
];
/* PDF files added from the phone are stored in IndexedDB so they persist */
function idb(){return new Promise(function(res,rej){
  try{var r=indexedDB.open("ebooks_pdfs",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("pdfs")};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};}catch(e){rej(e)}})}
function tx(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction("pdfs",mode),q=fn(t.objectStore("pdfs"));
  t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
function putPdf(id,blob){return tx("readwrite",function(st){return st.put(blob,String(id))})}
var mem={};
var lastId=null,lastPos=0;
try{var L=JSON.parse(localStorage.getItem("ebooks_last")||"null");if(L){lastId=L.id;lastPos=L.pos||0}}catch(e){}
function saveLast(){try{localStorage.setItem("ebooks_last",JSON.stringify({id:lastId,pos:lastPos}))}catch(e){}}
function curPos(){var bx=$("pages");return bx.scrollHeight>bx.clientHeight?bx.scrollTop/bx.scrollHeight:0}
function renderLast(){
  var el=$("last"),b=books.filter(function(x){return String(x.id)===String(lastId)})[0];
  if(!b||!(b.pdf||b.hasFile)){el.hidden=true;return}
  var bg=b.cover?"background-image:url('"+esc(b.cover)+"')":"background:"+esc(b.color||"#6b5f49");
  var pct=Math.round(lastPos*100);
  el.hidden=false;
  el.innerHTML='<div class="lthumb" style="'+bg+'"></div><div class="linfo"><div class="lk">Last read'+(pct>0?', '+pct+'% in':'')+'</div><div class="lt">'+esc(b.title)+'</div></div><button class="view" data-id="'+esc(b.id)+'">Resume</button>';
}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},6000)}
function getPdf(id){if(mem[id])return Promise.resolve(mem[id]);return tx("readonly",function(st){return st.get(String(id))}).catch(function(){return null})}
function delPdf(id){delete mem[id];tx("readwrite",function(st){return st.delete(String(id))}).catch(function(){})}
var KEY = "ebooks_v1";
var books = DEFAULT_BOOKS.slice();
try{var saved = JSON.parse(localStorage.getItem(KEY)||"null"); if(Array.isArray(saved)) books = saved;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books.filter(function(b){return !b.temp})))}catch(e){}}
var $ = function(id){return document.getElementById(id)};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var term = $("q").value.trim().toLowerCase();
  var list = books.filter(function(b){return !term || String(b.title).toLowerCase().indexOf(term)>-1});
  $("count").textContent = "(" + books.length + ")";
  $("empty").hidden = list.length>0;
  $("grid").innerHTML = list.map(function(b){
    var bg = b.cover ? "background-image:url('"+esc(b.cover)+"')" : "background:"+esc(b.color||"#6b5f49");
    var inner = b.cover ? "" : "<b>"+esc(b.title)+"</b>";
    return '<article class="book"><div class="cover" style="'+bg+'">'+inner+'</div>'+
      '<div class="title">'+esc(b.title)+'</div>'+
      '<button class="view" data-id="'+esc(b.id)+'"'+(b.pdf||b.hasFile?"":" disabled")+'>View PDF</button>'+
      '<button class="del" data-del="'+esc(b.id)+'" aria-label="Delete '+esc(b.title)+'">Delete</button></article>';
  }).join("");
  renderLast();
}

/* In-page PDF viewer (PDF.js, loaded on first use) */
var pdfDoc=null,zoom=1,renderTok=0,LIB="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadLib(){
  if(window.pdfjsLib) return Promise.resolve();
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=LIB+"pdf.min.js";
    s.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc=LIB+"pdf.worker.min.js";res()};
    s.onerror=function(){rej(new Error("lib"))};
    document.head.appendChild(s);
  });
}
function showMsg(t){$("pages").innerHTML='<p class="empty" style="color:#f3ecd9">'+t+'</p>'}
function draw(c,tok,w){
  pdfDoc.getPage(+c.dataset.n).then(function(pg){
    if(tok!==renderTok) return;
    var v1=pg.getViewport({scale:1}),dpr=Math.min(window.devicePixelRatio||1,2);
    var v=pg.getViewport({scale:(w/v1.width)*dpr});
    c.width=v.width;c.height=v.height;
    c.style.height=Math.round(w*v1.height/v1.width)+"px";
    pg.render({canvasContext:c.getContext("2d"),viewport:v});
  });
}
function buildPages(pos){
  var box=$("pages");box.innerHTML="";
  var tok=++renderTok,w=Math.min(box.clientWidth-16,900)*zoom;
  var obs=new IntersectionObserver(function(es){es.forEach(function(en){
    if(en.isIntersecting){obs.unobserve(en.target);draw(en.target,tok,w)}
  })},{root:box,rootMargin:"800px 0px"});
  for(var n=1;n<=pdfDoc.numPages;n++){
    var c=document.createElement("canvas");
    c.className="pg";c.dataset.n=n;
    c.style.width=w+"px";c.style.height=Math.round(w*1.414)+"px";
    box.appendChild(c);obs.observe(c);
  }
  if(pos) box.scrollTop=pos*box.scrollHeight;
}
function openPdf(b,blob){
  $("vt").textContent=b.title;
  $("open").href = blob ? URL.createObjectURL(blob) : b.pdf;
  var start=String(lastId)===String(b.id)?lastPos:0;
  lastId=b.id;lastPos=start;saveLast();renderLast();
  zoom=1;pdfDoc=null;
  $("viewer").classList.add("open");
  $("close").focus();
  showMsg("Loading PDF…");
  loadLib().then(function(){
    if(blob) return blob.arrayBuffer().then(function(buf){return pdfjsLib.getDocument({data:buf}).promise});
    return pdfjsLib.getDocument({url:b.pdf}).promise;
  }).then(function(d){pdfDoc=d;buildPages(start)},function(){
    showMsg("Could not show this PDF here. The viewer needs an internet connection the first time. Tap “Open PDF” to open it in your PDF app.");
  });
}
function closePdf(){
  if(!$("viewer").classList.contains("open")) return;
  if(pdfDoc){lastPos=curPos();saveLast();}
  $("viewer").classList.remove("open");
  $("pages").innerHTML="";pdfDoc=null;renderTok++;
  renderLast();
}
var st;
$("pages").addEventListener("scroll",function(){clearTimeout(st);st=setTimeout(function(){if(pdfDoc){lastPos=curPos();saveLast()}},400)});
$("zi").addEventListener("click",function(){if(pdfDoc){zoom=Math.min(3,zoom+.25);buildPages(curPos())}});
$("zo").addEventListener("click",function(){if(pdfDoc){zoom=Math.max(.5,zoom-.25);buildPages(curPos())}});

document.addEventListener("click",function(e){
  var d = e.target.closest(".del");
  if(d){
    var id = d.getAttribute("data-del");
    books = books.filter(function(x){return String(x.id)!==id});
    delPdf(id);
    save(); syncJson(); render(); return;
  }
  var btn = e.target.closest(".view");
  if(!btn) return;
  var b = books.filter(function(x){return String(x.id)===btn.getAttribute("data-id")})[0];
  if(!b) return;
  if(b.hasFile){
    getPdf(b.id).then(function(blob){
      if(blob) openPdf(b,blob);
      else alert("This PDF file is no longer stored in this browser. Add it again.");
    });
  } else if(b.pdf) openPdf(b);
});
$("close").addEventListener("click",closePdf);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePdf()});
$("q").addEventListener("input",render);

function syncJson(){$("json").value = JSON.stringify(books,null,2)}
$("apply").addEventListener("click",function(){
  try{
    var d = JSON.parse($("json").value);
    if(!Array.isArray(d)) throw new Error("Data must be a list of books.");
    books = d; save(); render(); $("msg").textContent = "Applied " + d.length + " books.";
  }catch(err){$("msg").textContent = "Invalid JSON: " + err.message}
});
$("reset").addEventListener("click",function(){books = DEFAULT_BOOKS.slice();save();syncJson();render();$("msg").textContent="Reset."});

syncJson(); render();

/* Add book */
var coverData = "", pdfFile = null;
function openForm(){
  $("fTitle").value="";$("fPdfFile").value=$("fCover").value="";
  coverData="";pdfFile=null;$("preview").style.display="none";$("fErr").textContent="";
  $("modal").classList.add("open");$("fTitle").focus();
}
function closeForm(){$("modal").classList.remove("open")}
$("addBtn").addEventListener("click",openForm);
$("fCancel").addEventListener("click",closeForm);
$("modal").addEventListener("click",function(e){if(e.target===this)closeForm()});
$("fPdfFile").addEventListener("change",function(){
  pdfFile = this.files[0] || null;
});
$("fCover").addEventListener("change",function(){
  var f=this.files[0]; if(!f){coverData="";$("preview").style.display="none";return}
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=300,h=Math.round(img.height*w/img.width),c=document.createElement("canvas");
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      coverData=c.toDataURL("image/jpeg",.8);
      $("preview").src=coverData;$("preview").style.display="block";
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
$("fSave").addEventListener("click",function(){
  var t=$("fTitle").value.trim();
  if(!t){$("fErr").textContent="Enter a title.";return}
  if(!pdfFile){$("fErr").textContent="Choose a PDF file.";return}
  var b={id:Date.now(),title:t,pdf:"",color:"#8c2f1b"};
  if(coverData)b.cover=coverData;
  var done=function(){books.push(b);save();syncJson();render();closeForm()};
  putPdf(b.id,pdfFile).then(function(){b.hasFile=true;done()},
    function(){mem[b.id]=pdfFile;b.hasFile=true;b.temp=true;done();toast("Saved for this visit only. Open the page from a web link (https) to keep PDFs after reload.")});
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeForm()});

/* Install / home-screen shortcut */
function mkIcon(n){
  var c=document.createElement("canvas");c.width=c.height=n;
  var x=c.getContext("2d");x.fillStyle="#8c2f1b";x.fillRect(0,0,n,n);
  x.fillStyle="#fff";x.font="bold "+Math.round(n*.5)+"px Georgia,serif";
  x.textAlign="center";x.textBaseline="middle";x.fillText("E",n/2,n/2);
  return c.toDataURL("image/png");
}
var webPage = /^https?:$/.test(location.protocol);
try{
  var ai=document.createElement("link");ai.rel="apple-touch-icon";ai.href=mkIcon(180);document.head.appendChild(ai);
  var ic=document.createElement("link");ic.rel="icon";ic.href=mkIcon(192);document.head.appendChild(ic);
  if(webPage){
    var u=location.href.split("#")[0];
    var man={name:"E-books",short_name:"E-books",start_url:u,scope:u.replace(/[^\/]*$/,""),display:"standalone",background_color:"#ede6d6",theme_color:"#8c2f1b",
      icons:[{src:mkIcon(192),sizes:"192x192",type:"image/png"},{src:mkIcon(512),sizes:"512x512",type:"image/png",purpose:"any"}]};
    var ml=document.createElement("link");ml.rel="manifest";
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
    document.head.appendChild(ml);
  }
}catch(e){}
var dip=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e});
window.addEventListener("appinstalled",function(){$("installBtn").hidden=true});
$("installBtn").addEventListener("click",function(){
  if(dip){dip.prompt();dip.userChoice.then(function(){dip=null});return}
  toast(webPage
    ? "In Chrome tap the \u22EE menu, then Install app or Add to Home screen."
    : "Install needs the web link. Open this page from its https address in Chrome, then tap \u22EE and choose Install app or Add to Home screen.");
});
</script>
</body>
</html>
